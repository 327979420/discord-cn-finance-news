services:
  news-bot:
    build:
      context: ..
    restart: unless-stopped
    env_file: ../.env
    environment:
      CONFIG_PATH: config/sources.selfhost-rsshub.json
    ports:
      - "3000:3000"
    volumes:
      - news-data:/app/data
      - ../config:/app/config:ro
    depends_on:
      rsshub:
        condition: service_healthy

  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1200/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  news-data:
