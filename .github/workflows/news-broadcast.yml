name: Chinese Finance News Broadcast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, do not send to Discord
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/news-broadcast.yml"
  schedule:
    # 10-minute cadence while private; global indices, star stocks and major events are screened each run.
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: chinese-finance-news-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: One-shot workflow heartbeat
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p .state
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .state/workflow-heartbeat.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .state/workflow-heartbeat.txt
          git commit -m "Debug finance radar workflow heartbeat"
          git push

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check configuration
        id: config
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          READY=true
          if [[ "$DRY_RUN_INPUT" != "true" && -z "$DISCORD_WEBHOOK_URL" ]]; then
            READY=false
            echo "::notice::Add the DISCORD_WEBHOOK_URL repository secret to enable broadcasts."
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN_INPUT" >> "$GITHUB_OUTPUT"

      - name: Run checks
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          mkdir -p .state
          set -o pipefail
          npm run check 2>&1 | tee .state/check.log

      - name: Save one-shot check diagnostics
        if: always() && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f .state/check.log ]]; then
            git add -f .state/check.log
            if ! git diff --cached --quiet; then
              git commit -m "Debug finance radar check output"
              git push
            fi
          fi

      - name: Fetch, rank and broadcast global radar
        if: steps.config.outputs.ready == 'true' && success()
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          DISCORD_USERNAME: 情报助手
          CONFIG_PATH: config/sources.json
          DATABASE_PATH: .state/news.db
          MAX_NEWS_AGE_MINUTES: 45
          MAX_ITEMS_PER_CYCLE: 6
          MAX_ITEMS_PER_SOURCE: 2
          MIN_IMPORTANCE_SCORE: 60
          BREAKING_IMPORTANCE_SCORE: 82
          MAX_CHINESE_CHARS: 72
          INCLUDE_SOURCE_URL: false
          REQUEST_TIMEOUT_MS: 25000
          RUN_ONCE: true
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
          NODE_NO_WARNINGS: 1
        run: |
          mkdir -p .state
          set -o pipefail
          node src/index.js 2>&1 | tee .state/last-run.log

      - name: Save deduplication state and one-shot diagnostic log
        if: steps.config.outputs.ready == 'true' && success() && steps.config.outputs.dry_run != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f .state/news.db ]]; then
            git add .state/news.db
          fi
          if [[ "${{ github.event_name }}" == "push" && -f .state/last-run.log ]]; then
            git add -f .state/last-run.log
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update finance radar runtime state"
            git push
          fi
