name: Chinese Finance News Broadcast

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only, do not send to Discord
        required: false
        default: false
        type: boolean
      force_digest:
        description: Build the latest digest card now, even if it was already posted
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - ".github/workflows/news-broadcast.yml"
  schedule:
    # Backup only. GitHub fires this a few times a day at best; the Cloudflare
    # Worker in scheduler/ dispatches the workflow every 15 minutes. Each run
    # posts a digest card if a slot (07:30, 12:00, 17:00, 21:15 Beijing) is due,
    # otherwise it only checks for emergencies.
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: chinese-finance-news-broadcast
  cancel-in-progress: false

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check configuration
        id: config
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          READY=true
          if [[ "$DRY_RUN_INPUT" != "true" && -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "::error::Missing DISCORD_WEBHOOK_URL repository secret."
            exit 1
          fi
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY_RUN_INPUT" >> "$GITHUB_OUTPUT"

      - name: Run checks
        run: npm run check

      - name: Is a digest card due?
        id: digest
        env:
          DATABASE_PATH: .state/news.db
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_digest || false }}
          NODE_NO_WARNINGS: 1
        run: node scripts/digest-due.js

      - name: Install Claude Code
        if: steps.digest.outputs.due == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.300

      # Copy-pasted tokens sometimes carry line breaks; strip them and mask the result.
      # Without the token, digest cards fall back to unedited headlines.
      - name: Load Claude token
        if: steps.digest.outputs.due == 'true'
        env:
          RAW: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          CLEAN=$(printf '%s' "$RAW" | tr -d '[:space:]')
          if [ -n "$CLEAN" ]; then echo "::add-mask::$CLEAN"; echo "CLAUDE_CODE_OAUTH_TOKEN=$CLEAN" >> "$GITHUB_ENV"; fi

      - name: Post digest card or emergency alerts
        if: steps.config.outputs.ready == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5-mini
          DISCORD_USERNAME: 情报助手
          CONFIG_PATH: config/sources.json
          DATABASE_PATH: .state/news.db
          MAX_NEWS_AGE_MINUTES: 45
          MAX_CATCHUP_AGE_MINUTES: 720
          MAX_ITEMS_PER_CYCLE: 6
          MAX_ITEMS_PER_SOURCE: 2
          MIN_IMPORTANCE_SCORE: 60
          BREAKING_IMPORTANCE_SCORE: 82
          MAX_CHINESE_CHARS: 72
          IMAGE_EVERY_N_MESSAGES: 10
          IMAGE_MIN_IMPORTANCE_SCORE: 82
          SIMILAR_NEWS_WINDOW_HOURS: 36
          INCLUDE_SOURCE_URL: false
          REQUEST_TIMEOUT_MS: 25000
          RUN_ONCE: true
          DIGEST_MODEL: sonnet
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.force_digest || false }}
          DRY_RUN: ${{ steps.config.outputs.dry_run }}
          NODE_NO_WARNINGS: 1
        run: node src/index.js

      - name: Save deduplication state
        # Preserve successful sends even if a different source/item failed later.
        if: always() && !cancelled() && steps.config.outputs.ready == 'true' && steps.config.outputs.dry_run != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -f .state/news.db ]]; then
            git add .state/news.db
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Update finance news delivery state"
            for attempt in 1 2 3; do
              git pull --rebase --quiet && git push --quiet && exit 0
              sleep 5
            done
            exit 1
          fi

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## 中文金融快讯运行摘要"
            echo "- 触发方式：${{ github.event_name }}"
            echo "- 配置就绪：${{ steps.config.outputs.ready || 'unknown' }}"
            echo "- 预览模式：${{ steps.config.outputs.dry_run || 'unknown' }}"
            echo "- 提交：\`${GITHUB_SHA:0:8}\`"
          } >> "$GITHUB_STEP_SUMMARY"
